[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuchad"
version = "0.1.0"
description = "CHADS-VASc Analysis Package for stroke risk prediction in AF patients"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "lifelines>=0.27.8",
]

[project.scripts]
nuchad = "nuchad:main"
make_table1 = "scripts.make_table1:main"
make_table2 = "scripts.make_table2:main"
make_table1_stratified = "scripts.make_table1_stratified:main"
make_table2_stratified = "scripts.make_table2_stratified:main"
run_eda = "scripts.run_eda:main"
visualize_followup = "scripts.visualize_followup:main"
density_reweighting = "scripts.density_reweighting:main"
model_comparison = "scripts.model_comparison:main"
filter_patients = "scripts.filter_patients:main"
compare_datasets = "scripts.compare_datasets:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nuchad", "src/scripts"]
include = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
