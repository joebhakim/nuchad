[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuchad"
version = "0.1.0"
description = "CHADS-VASc Analysis Package for stroke risk prediction in AF patients"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "lifelines>=0.27.8",
]

[project.scripts]
nuchad = "nuchad:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nuchad"]
include = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
